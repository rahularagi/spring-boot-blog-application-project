<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <title>Home</title>
    <style>
        .search-container {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .search-container input[type="text"] {
            width: 200px;
            margin-right: 10px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .search-button {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            background-color: #007bff;
            color: #fff;
        }

        .pagination {
            text-align: center;
        }

        .pagination a {
            display: inline-block;
            margin: 5px;
            padding: 8px 12px;
            text-decoration: none;
            background-color: #f2f2f2;
            color: #333;
            border-radius: 4px;
        }

        .pagination a:hover {
            background-color: #ddd;
        }

        .pagination .prev-button {
            margin-right: 10px;
        }

        .pagination .next-button {
            margin-left: 10px;
        }

        .sort-container {
            text-align: right;
            margin-bottom: 10px;
        }

        .sort-container label {
            margin-right: 5px;
        }

        .sort-container select {
            padding: 5px;
        }

        .pagination {
            text-align: center;
            margin-top: 10px;
        }

        .pagination a {
            display: inline-block;
            margin: 5px;
            padding: 8px 12px;
            text-decoration: none;
            background-color: #f2f2f2;
            color: #333;
            border-radius: 4px;
        }

        .pagination a:hover {
            background-color: #ddd;
        }

        .pagination .prev-button {
            margin-right: 10px;
        }

        .pagination .next-button {
            margin-left: 10px;
        }

        .filter-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .filter-container label {
            margin-right: 5px;
        }

        .filter-container input[type="text"] {
            padding: 5px;
            border-radius: 4px;
        }

        .filter-container button {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            background-color: #4CAF50;
            color: white;
        }

        #new-post-button {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            background-color: #4CAF50;
            color: white;
        }

        .post {
            border: 1px solid #ccc;
            background-color: #f2f2f2;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .post h2 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .post p {
            font-size: 14px;
            color: #777;
        }
        .view_post {
        color: inherit;
        text-decoration: none;
        cursor: pointer;
    }
    </style>
</head>
<body>
<header>
    <h1>My Blog Application</h1>
</header>

<div class="search-container">
    <input type="text" name="search" placeholder="Search">
    <button class="search-button">Search</button>
    &nbsp;&nbsp;&nbsp;
    <button class="login-button">Login</button>
    <br><br>
</div>

<div class="sort-container">
    <label for="sort-select">Sort by:</label>
    <select id="sort-select">
        <option value="name">Name</option>
        <option value="id">ID</option>
        <option value="date">Date</option>
    </select>
</div>

<div class="post-container">
    <div th:if="${listPosts.empty}">
        <p>No posts found.</p>
    </div>
    <a th:each="post : ${listPosts}" th:href="@{'view_post/' + ${post.id}}" class="view_post">
        <div class="post">
            <h2 th:text="${post.title}"></h2>
            <p th:text="${post.excerpt}"></p>
            <p th:text="${post.author}"></p>
            <p th:text="${post.publishedAt}"></p>
            <span>Tags: </span>
            <span th:each="tag : ${post.tags}">
            <span th:text="${tag.name}"></span>&nbsp;
        </span>
            <form  th:action="@{'view_comments/' + ${post.id}}">
<!--                <input type="hidden" name="postId" th:value="${post.id}">-->
                <button class="view-comment-button">View Comments</button>
            </form>
        </div>
    </a>
</div>

<div class="pagination">
    <span th:if="${totalPages > 1 && currentPage > 1}">
        <a th:href="@{'/'+${currentPage - 1}}">&laquo; Previous</a>
    </span>

    <span th:if="${currentPage < totalPages}">
        <a th:href="@{'/'+${currentPage + 1}}">Next &raquo;</a>
    </span>
</div>
<div class="filter-container">
    <label for="author-filter">Author:</label>
    <input type="text" id="author-filter" name="author-filter">

    <label for="tags-filter">Tags:</label>
    <input type="text" id="tags-filter" name="tags-filter">

    <button id="apply-filters">Apply Filters</button>
</div>

<form action="new_post">
    <button id="new-post-button">New Post</button>
</form>
</body>
</html>
