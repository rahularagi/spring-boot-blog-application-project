            padding: 5px;

        .filter-container button {

            border-radius: 4px;

            border: 1px solid #ccc;

        }

            font-size: 18px;
            margin-bottom: 5px;

        .post p {
            font-size: 14px;
            color: #777;
        }
        .buttons button.delete {
            background-color: #f39c12;
            color: #fff;
        }

        color: inherit;
        text-decoration: none;
        cursor: pointer;
    }

<div class="sort-container">
    <form th:action="@{'/'+${currentPage}+'?sortField='+${sortField}+'&sortDir='+${reverseSortDir}}">
        <!-- Sorting functionality -->
        <label for="sort-select">Sort by:</label>
        <select id="sort-select" name="sortField">
            <option value="title" th:selected="${sortField == 'title'}">Name</option>
            <option value="id" th:selected="${sortField == 'id'}">ID</option>
            <option value="publishedAt" th:selected="${sortField == 'publishedAt'}">Date</option>
        </select>
<!--        <input type="hidden" name="sortDir" th:value="${reverseSortDir}">-->
        <button type="submit" name="sortDir" value="asc">Ascending</button>
        <button type="submit" name="sortDir" value="desc">Descending</button>
<!--        <button type="submit">Sort</button>-->
    </form>
</div>

<div class="post-container">
    <div th:if="${listPosts.empty}">
        <p>No posts found.</p>
    </div>
    <a th:each="post : ${listPosts}" th:href="@{'view_post/' + ${post.id}}" class="view_post">
        <div class="post">
            <h2 th:text="${post.title}"></h2>
            <p th:text="${post.excerpt}"></p>
            <p th:text="${post.author}"></p>
            <p th:text="${post.publishedAt}"></p>
            <span>Tags: </span>
            <span th:each="tag : ${post.tags}">
            <span th:text="${tag.name}"></span>&nbsp;
        </span>
            <form  th:action="@{'view_comments/' + ${post.id}}">
                <button class="view-comment-button">View Comments</button>
            </form>
            <br>
            <form th:action="@{'delete/' + ${post.id}}" method="post">
                <button class="delete" onclick="deletePost()">Delete Post</button>
            </form>
        </div>
    </a>
</div>

<div class="pagination">
    <span th:if="${totalPages > 1 && currentPage > 1}">
        <a th:href="@{'/'+${currentPage - 1}+'?sortField='+${sortField}+'&sortDir='+${reverseSortDir}}">&laquo; Previous</a>
    </span>

    <span th:if="${currentPage < totalPages}">
        <a th:href="@{'/'+${currentPage + 1}+'?sortField='+${sortField}+'&sortDir='+${reverseSortDir}}">Next &raquo;</a>
    </span>
</div>
<form action="new_post">
    <button id="new-post-button">New Post</button>
</form>
<br>
<div class="filter-container">
    <label for="author-filter">Author:</label>
    <input type="text" id="author-filter" name="author-filter">

    <label for="tags-filter">Tags:</label>
    <input type="text" id="tags-filter" name="tags-filter">

    <button id="apply-filters">Apply Filters</button>
</div>
