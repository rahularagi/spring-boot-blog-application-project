<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Home</title>
    <style>
        .search-container {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }
        .search-container input[type="text"] {
            width: 200px;
            margin-right: 10px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .search-button {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            background-color: #007bff;
            color: #fff;
        }
        .pagination {
            text-align: center;
        }
        .pagination a {
            display: inline-block;
            margin: 5px;
            padding: 8px 12px;
            text-decoration: none;
            background-color: #f2f2f2;
            color: #333;
            border-radius: 4px;
        }
        .pagination a:hover {
            background-color: #ddd;
        }
        .pagination .prev-button {
            margin-right: 10px;
        }
        .pagination .next-button {
            margin-left: 10px;
        }
        .sort-container {
            text-align: right;
            margin-bottom: 10px;
        }
        .sort-container label {
            margin-right: 5px;
        }
        .sort-container select {
            padding: 5px;
        }
        .pagination {
            text-align: center;
            margin-top: 10px;
        }
        .pagination a {
            display: inline-block;
            margin: 5px;
            padding: 8px 12px;
            text-decoration: none;
            background-color: #f2f2f2;
            color: #333;
            border-radius: 4px;
        }
        .pagination a:hover {
            background-color: #ddd;
        }
        .pagination .prev-button {
            margin-right: 10px;
        }
        .pagination .next-button {
            margin-left: 10px;
        }
        .filter-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .filter-container label {
            margin-right: 5px;
        }
        .filter-container input[type="text"] {
            padding: 5px;
            border-radius: 4px;
        }
        .filter-container button {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            background-color: #4CAF50;
            color: white;
        }
        #new-post-button {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            background-color: #4CAF50;
            color: white;
        }
        .post {
            border: 1px solid #ccc;
            background-color: #f2f2f2;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .post h2 {
            font-size: 18px;
            margin-bottom: 5px;
        }
        .post p {
            font-size: 14px;
            color: #777;
        }
        .buttons button.delete {
            background-color: #f39c12;
            color: #fff;
        }
        .view_post {
        color: inherit;
        text-decoration: none;
        cursor: pointer;
        }
        .post-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .refresh-button {
            padding: 2px 7px;
            border: none;
            border-radius: 3px;
            background-color: #4CAF50;
            color: white;
    }
    </style>
</head>
<body>
<header>
    <h1>My Blog Application</h1>
</header>
<div sec:authorize="isAuthenticated()">
<p>
    User:<span sec:authentication="principal.username"></span>
    <br>
    <br>
    Role:<span sec:authentication="principal.authorities"></span>
</p>
</div>
<div class="search-container">
    <button type="submit" class="refresh-button" onclick="location.href='/'">Refresh</button>
    &nbsp;&nbsp;
    <form th:action="@{/home} +'?pageNo='+${currentPage}+'&sortField='+${sortField}+'&sortDir='+${sortDir}">
        <input type="text" name="keyword" placeholder="Search" th:value="${searchKeyword}">
        <button class="search-button">Search</button>
    </form>
    <form th:action="@{/login}" sec:authorize="!isAuthenticated()">
        <button class="login-button">Login</button>
    </form>
</div>
<div class="sort-container">
        <span th:if="${selectedAuthor != null && selectedPublishedDate != null && selectedTag != null}">
            <form th:action="@{/home} +'?pageNo='+${currentPage}+'&sortField='+${sortField}+'&sortDir='+${sortDir}">
                <label for="filter-sort-select">Sort by:</label>
                <select id="filter-sort-select" name="sortField">
                    <option value="title" th:selected="${sortField == 'title'}">Name</option>
                    <option value="id" th:selected="${sortField == 'id'}">ID</option>
                    <option value="publishedAt" th:selected="${sortField == 'publishedAt'}">Date</option>
                </select>
                <input type="hidden" name="author"  th:value="${selectedAuthor}">
                <input type="hidden" name="publishedDate"  th:value="${selectedPublishedDate}">
                <input type="hidden" name="tags"  th:value="${selectedTag.replace('#', '')}">
                <button type="submit" name="sortDir" value="asc">Ascending</button>
                <button type="submit" name="sortDir" value="desc">Descending</button>
            </form>
        </span>
    <span th:unless="${selectedAuthor != null && selectedPublishedDate != null && selectedTag != null}">
            <span th:if="${searchKeyword != null}">
                <form th:action="@{/home} +'?pageNo='+${currentPage}+'&sortField='+${sortField}+'&sortDir='+${sortDir}">
                    <label for="search-sort-select">Sort by:</label>
                    <select id="search-sort-select" name="sortField">
                        <option value="title" th:selected="${sortField == 'title'}">Name</option>
                        <option value="id" th:selected="${sortField == 'id'}">ID</option>
                        <option value="publishedAt" th:selected="${sortField == 'publishedAt'}">Date</option>
                    </select>
                    <input type="hidden" name="keyword" placeholder="Search" th:value="${searchKeyword}">
                    <button type="submit" name="sortDir" value="asc">Ascending</button>
                    <button type="submit" name="sortDir" value="desc">Descending</button>
                </form>
            </span>
            <span th:if="${#strings.isEmpty(searchKeyword) && searchKeyword == null}">
                <form th:action="@{/home} +'?pageNo='+${currentPage}+'&sortField='+${sortField}+'&sortDir='+${sortDir}">
                    <label for="sort-select">Sort by:</label>
                    <select id="sort-select" name="sortField">
                        <option value="title" th:selected="${sortField == 'title'}">Name</option>
                        <option value="id" th:selected="${sortField == 'id'}">ID</option>
                        <option value="publishedAt" th:selected="${sortField == 'publishedAt'}">Date</option>
                    </select>
                    <button type="submit" name="sortDir" value="asc">Ascending</button>
                    <button type="submit" name="sortDir" value="desc">Descending</button>
                </form>
            </span>
        </span>
</div>
<div class="post-container">
    <div th:if="${listPosts.empty}">
        <p>No posts found.</p>
    </div>
    <a th:each="post : ${listPosts}" th:href="@{'view_post/' + ${post.id}}" class="view_post">
        <div class="post" th:if="${not listPosts.empty}">
            <h2 th:text="${post.title}"></h2>
            <p><strong>Excerpt:</strong> <span th:text="${post.excerpt}"></span></p>
            <p><strong>Author:</strong> <span th:text="${post.author}"></span></p>
            <p><strong>Published At:</strong> <span th:text="${post.publishedAt}"></span></p>
            <span><strong>Tags:</strong></span>
            <span th:each="tag : ${post.tags}">
                    <span th:text="${tag.name}"></span>&nbsp;
                </span>
                <form th:action="@{/view_comments}">
                    <input type="hidden" name="postId" th:value="${post.id}" />
                    <input type="hidden" name="postAuthor" th:value="${post.author}"/>
                <button class="view-comment-button">View Comments</button>
            </form>
            <br>
            <div sec:authorize="isAuthenticated()">
                <span th:if="${post.author == #authentication.principal.username or #authorization.expression('hasRole(''ADMIN'')')}">
            <form th:action="@{'delete/' + ${post.id}}" method="post">
                <button class="delete" onclick="deletePost()">Delete Post</button>
            </form>
                </span>
            </div>
        </div>
    </a>
</div>
<div class="pagination">
        <span th:if="${selectedAuthor != null && selectedPublishedDate != null && selectedTag != null}">
            <span th:if="${totalPages > 1 && currentPage > 1}">
                <a th:href="@{/home} + '?author='+${selectedAuthor}+'&publishedDate='+${selectedPublishedDate}+'&tags='+${selectedTag.replace('#', '')}+'&pageNo='+${currentPage - 1}+'&sortField='+${sortField}+'&sortDir='+${sortDir}">&laquo; Previous</a>
            </span>
            <span th:if="${currentPage < totalPages}">
                <a th:href="@{/home}+'?author='+${selectedAuthor}+'&publishedDate='+${selectedPublishedDate}+'&tags='+${selectedTag.replace('#', '')}+'&pageNo='+${currentPage + 1}+'&sortField='+${sortField}+'&sortDir='+${sortDir}">Next &raquo;</a>
            </span>
        </span>
        <span th:unless="${selectedAuthor != null && selectedPublishedDate != null && selectedTag != null}">
            <span th:if="${searchKeyword != null}">
                <span th:if="${totalPages > 1 && currentPage > 1}">
                    <a th:href="@{/home} +'?pageNo='+${currentPage - 1}+'&sortField='+${sortField}+'&sortDir='+${sortDir}+'&keyword='+${searchKeyword}">&laquo; Previous</a>
                </span>
                <span th:if="${currentPage < totalPages}">
                    <a th:href="@{/home} +'?pageNo='+${currentPage + 1}+'&sortField='+${sortField}+'&sortDir='+${sortDir}+'&keyword='+${searchKeyword}">Next &raquo;</a>
                </span>
            </span>
            <span th:if="${#strings.isEmpty(searchKeyword) && searchKeyword == null}">
                <span th:if="${totalPages > 1 && currentPage > 1}">
                    <a th:href="@{/home} +'?pageNo='+${currentPage - 1}+'&sortField='+${sortField}+'&sortDir='+${sortDir}">&laquo; Previous</a>
                </span>
                <span th:if="${currentPage < totalPages}">
                    <a th:href="@{/home} +'?pageNo='+${currentPage + 1}+'&sortField='+${sortField}+'&sortDir='+${sortDir}">Next &raquo;</a>
                </span>
            </span>
        </span>
</div>
<div sec:authorize="isAuthenticated()">
    <div sec:authorize="isAuthenticated() or hasRole('ADMIN')">
       <form action="new_post">
           <button id="new-post-button">New Post</button>
       </form><br>
    </div>
</div>
<div class="filter-container">
    <form th:action="@{/home}" method="get">
        <label for="author-filter">Author:</label>
        <select id="author-filter" name="author">
            <option value="">All Authors</option>
            <option th:each="eachAuthors : ${allAuthors}" th:value="${eachAuthors}" th:text="${eachAuthors}" th:selected="${eachAuthors == selectedAuthor}"></option>
        </select>
        <label for="datetime-filter">Published Date:</label>
        <select id="datetime-filter" name="publishedDate">
            <option value="">All Dates</option>
            <option th:each="date : ${allPublishedAt}" th:value="${date}" th:text="${date}" th:selected="${date == selectedPublishedDate}"></option>
        </select>
        <label for="tags-filter">Tags:</label>
        <select id="tags-filter" name="tags">
            <option value="">All Tags</option>
            <option th:each="tag : ${allTags}" th:value="${tag}" th:text="${tag}" th:selected="${tag == selectedTag}"></option>
        </select>
        <button id="apply-filters">Apply Filters</button>
    </form>
</div>
    <form action="" th:action="@{/logout}" method="Post" sec:authorize="isAuthenticated()">
        <input type="submit" value="Logout"/>
    </form>
</body>
</html>
